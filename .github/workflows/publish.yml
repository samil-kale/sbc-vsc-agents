name: Publish extensions

on:
  push:
    branches:
      - production

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - sbc-claude-code
          - sbc-open-code
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx vsce publish --no-dependencies -p "$VSCE_PAT"
        working-directory: ${{ matrix.package }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
